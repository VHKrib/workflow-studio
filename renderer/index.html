<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>工作流开发平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">WF</div>
      <div>
        <input id="flowName" class="brand-title" spellcheck="false" value="未命名工作流">
      </div>
    </div>
    <div class="flowagent" title="这条流程的执行 agent（可换）">
      <select id="flowAgent"></select>
    </div>
    <span class="sp"></span>
    <button id="btnRead" class="readbtn">⇣ 读取 agent 链路</button>
    <div class="menu-wrap">
      <button id="btnAddCard" class="ghost">+ 加卡片</button>
      <div class="menu" id="addMenu">
        <div data-kind="in">输入卡</div>
        <div data-kind="proc">加工卡</div>
        <div data-kind="out">输出卡</div>
      </div>
    </div>
    <button id="btnValidate">逐卡验证</button>
    <button id="btnNew">新建工作流</button>
    <button id="btnOpen">导入</button>
    <button id="btnSave">导出</button>
    <button id="btnRun" class="primary">▶ 开始运行</button>
  </div>

  <div class="layout" id="layout">
    <!-- 左边：和 agent 的对话框（卡片信息 + 聊天），没选卡片时自动收起 -->
    <aside class="panel">
      <div class="ph"><span id="panelTitle">工作流概览</span><span class="sp"></span><span id="panelDel" title="删除这张卡（连线一起删）">✕</span></div>
      <div class="pb" id="panelBody"></div>
      <div class="foot">
        <span id="footStat">0 环节 / 0 连线</span>
        <span class="sp" style="flex:1"></span>
        <span id="savePath" style="color:#726d64"></span>
      </div>
    </aside>

    <section class="canvaswrap">
      <div id="wrap">
        <div id="canvas"><svg id="edges"></svg><svg id="fx"></svg></div>
      </div>
      <button id="emptyRead" class="emptyread">⇣ 读取 agent 链路</button>
      <div class="dock" id="dock">
        <div class="dock-hd"><b>和平台主管聊</b><span class="sp"></span><span id="dockMin" title="收起">—</span></div>
        <div class="dock-log" id="dockLog"></div>
        <div class="dock-in">
          <textarea id="dockIn" rows="1" placeholder="问点什么…（Enter 发送 · Shift+Enter 换行）"></textarea>
          <button id="dockSend" class="primary">发送</button>
        </div>
      </div>
      <div class="dock-fab" id="dockFab" title="展开：和平台主管聊">✍ 和 agent 聊</div>
      <div class="zoombar">
        <span id="zoomOut" title="缩小">−</span>
        <span id="zoom">100%</span>
        <span id="zoomIn" title="放大">+</span>
        <span id="zoomReset" title="复位">⌂</span>
      </div>
    </section>

    <!-- 右边：工作流列表 -->
    <aside class="side">
      <h3>工作流 · 一块画布</h3>
      <div id="wfList"></div>
    </aside>
  </div>

  <div id="panelTab" title="展开对话／概览">概览</div>

  <div id="radial"></div>

  <div id="modal" class="modal">
    <div class="mbox">
      <div class="mhd"><b>开始前：确认执行 agent</b><span id="mClose">✕</span></div>
      <div class="mbody" id="mBody"></div>
      <div class="mfoot">
        <span id="mHint" style="color:#726d64;font-size:11.5px"></span>
        <span style="flex:1"></span>
        <button id="mAdd">+ 再加一个环节</button>
        <button id="mCancel">取消</button>
        <button id="mGo" class="primary">确认并开始</button>
      </div>
    </div>
  </div>

  <div id="readModal" class="modal">
    <div class="mbox rbox">
      <div class="mhd"><b>读取 agent 链路</b><span id="rClose">✕</span></div>
      <div class="rbody">
        <div class="rpick" id="rPick"></div>
        <div class="rmain" id="rMain"></div>
      </div>
      <div class="mfoot">
        <span id="rHint" class="rhint"></span>
        <span style="flex:1"></span>
        <button id="rAgain">重新分析</button>
        <button id="rPlace" class="primary">放进画布</button>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
