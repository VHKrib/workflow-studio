<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: blob:">
<title>实时画布</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="live.css">
</head>
<body class="live">
  <!-- 只有三样：选对话、跟随开关、当前状态。这张窗口只读，不提供任何编辑入口 -->
  <div class="lbar">
    <div class="lbrand">实时画布</div>
    <div class="lpick"><select id="lconv" title="最近有活动的对话（谁 · 什么时候 · 在做什么）"></select></div>
    <label class="lswitch" title="开：每秒读一次增量，画布跟着长；关：立刻停下，画面留在原地">
      <input type="checkbox" id="lfol"><span class="ltrack"></span><span class="lword">跟随</span>
    </label>
    <span class="sp"></span>
    <span id="lstat" class="lstat"></span>
    <button id="lana" class="lana" title="让平台主管把这条对话解析成链路（用到的文件 → 加工方式 → 产出的文件）">解析链路</button>
  </div>
  <!-- 这条链路真正反复用到的东西：素材 / 实现路径 / 结果（同名涨计数）；寒暄闲聊不进这里也不上画布 -->
  <div class="lents" id="lents"></div>
  <div class="canvaswrap lwrap">
    <div id="wrap"><div id="canvas"><svg id="edges"></svg></div></div>
    <div class="lempty" id="lempty">选一条对话，再打开「跟随」</div>
    <div class="ltip" id="ltip"></div>
    <!-- 双击卡片打开：长得和主画布那张卡片信息一样（名字 / 类型 / 内容 / 模块 / 内部实现） -->
    <aside class="ledit" id="ledit">
      <div class="panel lpanel">
        <div class="ph"><b id="ledTitle">卡片</b><span id="ledClose" title="关掉">✕</span></div>
        <div class="pb">
          <input class="titleinp" id="ledName" maxlength="24" placeholder="卡片名">
          <div class="kindrow"><span class="lab">类型</span><select id="ledKind"></select></div>
          <div class="pgroup" id="ledGroup"><span class="lab" id="ledLab">内容</span>
            <textarea id="ledBody" rows="4" maxlength="260"></textarea>
          </div>
          <div class="pmods"><span class="lab" id="ledModLab">模块</span>
            <div class="pm-list" id="ledMods"></div>
          </div>
          <details class="internal"><summary>⚙ 每个模块对应的文件（悬停预览用）</summary>
            <div id="ledPaths"></div>
          </details>
          <details class="internal"><summary>⚙ 内部实现 · 卡片上不显示</summary>
            <textarea id="ledImpl" rows="3" maxlength="600"></textarea>
          </details>
        </div>
      </div>
    </aside>
    <div class="zoombar">
      <span id="zoomOut" title="缩小">−</span>
      <span id="zoom">100%</span>
      <span id="zoomIn" title="放大">+</span>
      <span id="zoomReset" title="复位">⌂</span>
    </div>
  </div>
<script src="live.js"></script>
</body>
</html>
